name: "彼之世界"
description: "GitHub Pages Blog"

repository: bizhishijie/bizhishijie.github.io

media: "images"

workflow: tower

prose:
  - name: "Posts"
    directory: "_posts"
    extension: "md"
    format: "frontmatter"
    frontmatter:
      - name: "layout"
        field:
          element: "hidden"
          value: "post"
      - name: "title"
        field:
          element: "text"
          label: "Title"
          placeholder: "Post title"
      - name: "date"
        field:
          element: "text"
          label: "Date"
          placeholder: "YYYY-MM-DD"
      - name: "categories"
        field:
          element: "multiselect"
          label: "Categories"
          placeholder: "Add categories"
      - name: "tags"
        field:
          element: "multiselect"
          label: "Tags"
          placeholder: "Add tags"

  - name: "Pages"
    extension: "md"
    format: "frontmatter"
    frontmatter:
      - name: "layout"
        field:
          element: "hidden"
          value: "page"
      - name: "title"
        field:
          element: "text"
          label: "Title"
          placeholder: "Page title"
